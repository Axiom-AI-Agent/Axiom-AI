# Axiom AI — runtime parameters (non-secret)

provider:
  default: openai
  tier: general

llm:
  temperature: 0.0
  max_tokens: 2000
  streaming: false
  roles:
    chat:
      provider: openai
      tier: general
    merge:
      provider: google
      tier: general
    router:
      provider: openai
      tier: general
    guardrail:
      provider: openai
      tier: general
    extractor:
      provider: openai
      tier: general
    # Vision transcription for scanned PDF pages (see ingest.ocr below).
    ocr:
      provider: google
      tier: ocr

embedding:
  provider: openai
  tier: small
  batch_size: 100

chunking:
  fixed:
    chunk_size: 800
    chunk_overlap: 100
  parent_child:
    parent_size: 1200
    child_size: 250
    child_overlap: 50
  # Split on markdown headings so parents are semantic sections, and prefix each
  # child with its heading breadcrumb before embedding.
  respect_markdown_headers: true
  contextualize_children: true
  token_encoding: cl100k_base

ingest:
  max_upload_mb:
    pdf: 50
    docx: 25
    markdown: 5
  ocr:
    # Scanned/image-only pages are transcribed by the `ocr` LLM role. Only pages
    # that fail the text-yield check below are sent — never the whole document.
    enabled: true
    min_chars_per_page: 100
    min_alpha_ratio: 0.5
    max_pages_per_doc: 50
    dpi: 200
  docx:
    # Word files exported from Google Docs often carry no Heading styles at all;
    # recover section boundaries from standalone bold paragraphs.
    promote_bold_headings: true

retrieval:
  top_k: 4
  similarity_threshold: 0.35
  escalation_threshold: 0.45

paths:
  data_dir: data
  kb_dir: data/knowledge_base
  uploads_dir: data/uploads
  logs_dir: logs

logging:
  level: INFO

observability:
  enabled: true

qdrant:
  collection_prefix: axiom_kb

memory:
  st_max_turns: 30
  st_ttl_seconds: 86400

messaging:
  dry_run: true
