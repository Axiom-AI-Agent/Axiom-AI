name: Publish & Deploy Axiom AI API

on:
  push:
    branches:
      - AI-Backend-dev
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Build & Push API Image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: AI-backend
          file: AI-backend/docker/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/axiom-ai-api:latest
            ${{ secrets.DOCKER_USERNAME }}/axiom-ai-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy API to DigitalOcean Droplet
    runs-on: ubuntu-latest
    needs: push_to_registry
    steps:
      - name: Execute remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            cd ~/Axiom-AI
            git pull origin AI-Backend-dev
            cd AI-backend
            docker compose -f compose.prod.api.yaml pull
            docker compose -f compose.prod.api.yaml up -d
            docker image prune -f
